services:
  qdrant_service:
    image: qdrant/qdrant
    container_name: qdrant_service
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    # Qdrant'ın tamamen hazır olduğunu doğrulamak için healthcheck ekledik
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana_service:
    image: grafana/grafana
    container_name: grafana_service
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  vector:
    image: timberio/vector:0.47.0-alpine
    container_name: vector_service
    volumes:
      - ./vector:/etc/vector:ro
      - vector_data:/var/lib/vector # Vector'ün iç veri depolaması için gerekli
    command: ["--config", "/etc/vector/vector.yaml"]
    restart: unless-stopped

volumes:
  qdrant_data:
  grafana_data:
  vector_data: # Vector datası için volume tanımı